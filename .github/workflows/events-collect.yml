name: Events — collect

# Каждое утро собирает события в data/events.json и data/events.md
on:
  schedule:
    - cron: "7 4 * * *"   # ~6:07 по Берлину летом, 5:07 зимой
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events-collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/events/collect.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "tut.dus bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data && git commit -m "Events: $(jq .count data/events.json) [skip ci]"
            git pull --rebase -q && git push
          fi
