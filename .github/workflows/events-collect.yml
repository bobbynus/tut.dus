name: Events — collect

# Каждое утро собирает события в data/events.json и data/events.md
on:
  schedule:
    - cron: "15 8 * * *"   # ~10:15 по Берлину: после сброса дневного лимита Gemini (полночь по Тихоокеанскому)
  workflow_dispatch:
    inputs:
      no_llm:
        description: "Без нейросети (тест, не тратит лимит Gemini)"
        type: boolean
        default: false   # «Часы» запускают сбор вручную — по умолчанию он должен быть полноценным

permissions:
  contents: write

concurrency:
  group: events-collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NO_LLM: ${{ inputs.no_llm && '1' || '' }}
        run: python3 tools/events/collect.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "tut.dus bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data && git commit -m "Events: $(jq .count data/events.json) [skip ci]"
            git pull --rebase -q && git push
          fi
