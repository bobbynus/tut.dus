name: Inspect page

# Разведка: откуда страница на JS берёт данные (для подключения новых источников событий).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Адрес страницы (или toubiz — разведка API календаря Visit Düsseldorf)"
        required: true
      args:
        description: "Слово-подсказка и доп. адреса через пробел"
        required: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "${{ inputs.url }}" = "toubiz" ]; then python3 tools/events/toubiz.py
          else python3 tools/events/inspect_page.py "${{ inputs.url }}" ${{ inputs.args }}; fi
