name: Music

# Свежая бесплатная музыка для сторис и рилсов (Mixkit, самые популярные треки по настроениям).
# Раз в неделю добирает по 1 новому треку на настроение (~4 МБ в неделю); probe — разведка источников.
on:
  schedule:
    - cron: "17 4 * * 1"   # понедельник утром
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch | probe"
        default: "fetch"
      per:
        description: "Сколько новых треков на настроение"
        default: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: music

jobs:
  music:
    runs-on: ubuntu-24.04  # закреплено: на 26.04 Playwright не ставится (октябрь 2026)
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - if: inputs.mode == 'probe'
        run: python3 tools/music/probe.py tools/music/probe.txt
      - if: inputs.mode != 'probe'
        run: |
          bash tools/apt.sh ffmpeg
          python3 tools/music/fetch.py --per "${{ inputs.per || '1' }}"
      - if: inputs.mode != 'probe'
        run: |
          if [ -n "$(git status --porcelain library)" ]; then
            git config user.name "tut.dus bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A library && git commit -qm "Music: свежие треки [skip ci]"
            git pull --rebase -q && git push -q
          fi
