name: Events — probe sources

on:
  workflow_dispatch:
    inputs:
      list:
        description: "Файл со списком адресов"
        default: "tools/events/candidates.txt"
      grep:
        description: "Слово, вокруг которого показать текст (необязательно)"
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GREP: ${{ inputs.grep }}
        run: python3 tools/events/probe.py "${{ inputs.list || 'tools/events/candidates.txt' }}"
