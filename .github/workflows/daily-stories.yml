name: Daily stories

# Утренние сторис «Сегодня в Дюссельдорфе». Вечером готовит сторис на завтра, 08:00 (Берлин);
# публикует их workflow Publish. Пауза: положить файл AUTOPOST_PAUSED в корень репозитория.
on:
  schedule:
    - cron: "30 18 * * *"   # 20:30 по Берлину летом / 19:30 зимой — сторис на завтра
  workflow_dispatch:
    inputs:
      date:
        description: "Дата сторис (YYYY-MM-DD). Пусто — завтра"
        required: false

permissions:
  contents: write

concurrency:
  group: events-collect

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install renderer
        run: |
          npm i -g playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd design && npm ci --silent
      - name: Build stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_DATE: ${{ inputs.date }}
        run: python3 tools/stories/daily.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain posts data)" ]; then
            git config user.name "tut.dus bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts data && git commit -m "Daily stories ${{ inputs.date }} [skip ci]"
            git pull --rebase -q && git push
          fi
