name: Daily stories

# Утренние сторис «Сегодня в Дюссельдорфе». Собирает события, готовит сторис на 08:00 (Берлин);
# публикует их workflow Publish. Пауза: положить файл AUTOPOST_PAUSED в корень репозитория.
on:
  schedule:
    - cron: "20 5 * * *"   # 07:20 по Берлину летом / 06:20 зимой
  workflow_dispatch:
    inputs:
      date:
        description: "Дата сторис (YYYY-MM-DD). Пусто — сегодня"
        required: false

permissions:
  contents: write

concurrency:
  group: events-collect

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install renderer
        run: |
          npm i -g playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd design && npm ci --silent
      - name: Fresh events
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          # если утренний сбор ещё не отработал сегодня — собрать сейчас
          if [ "$(jq -r .generated_at data/events.json | cut -c1-10)" != "$(TZ=Europe/Berlin date +%F)" ]; then
            python3 tools/events/collect.py
          fi
      - name: Build stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_DATE: ${{ inputs.date }}
        run: python3 tools/stories/daily.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain posts data)" ]; then
            git config user.name "tut.dus bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts data && git commit -m "Daily stories ${{ inputs.date }} [skip ci]"
            git pull --rebase -q && git push
          fi
