<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ТУТ.DUS — турнир, слои поверх видео</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { background: transparent !important }
  .overlay { height: 1920px; background: transparent; color: var(--white); padding: 260px 88px 440px;
             justify-content: flex-end }
  /* затемнение снизу, чтобы текст читался на любом кадре */
  .overlay::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, rgba(0,0,0,.78) 100%) }
  .overlay > * { position: relative }
  .overlay .top { position: absolute; top: 120px; left: 88px; right: 88px }
  .chip { display: inline-block; background: var(--red); color: var(--white); font: 700 30px/1 var(--display);
          padding: 16px 24px; border-radius: 99px; align-self: flex-start; margin-bottom: 32px; letter-spacing: .04em }
  .ov-big { font: 900 150px/0.92 var(--display); letter-spacing: -.035em }
  .ov-h { font: 900 92px/1.02 var(--display); letter-spacing: -.02em }
  .ov-p { font: 500 44px/1.3 var(--body); margin-top: 28px }
  .ov-p b { color: var(--white); background: var(--red); padding: 2px 12px; border-radius: 8px; font-weight: 700 }
</style></head><body>

<section class="slide overlay" id="o1">
  <div class="top"><span class="logo">ТУТ<i>.DUS</i></span><span>Eller</span></div>
  <span class="chip">9–11 ОКТЯБРЯ</span>
  <div class="ov-big">Рыцар&shy;ский турнир</div>
  <p class="ov-p">Самый большой в&nbsp;Дюссельдорфе</p>
</section>

<section class="slide overlay" id="o2">
  <div class="top"><span class="logo">ТУТ<i>.DUS</i></span><span>Огненные шоу</span></div>
  <div class="ov-h">Огненное шоу на&nbsp;лошадях</div>
  <p class="ov-p"><b>Пт 20:30</b> &nbsp; <b>Сб 21:30</b></p>
</section>

<section class="slide overlay" id="o3">
  <div class="top"><span class="logo">ТУТ<i>.DUS</i></span><span>@tut.dus</span></div>
  <div class="ov-big" style="font-size:140px">Сохрани</div>
  <p class="ov-p">и отметь, с&nbsp;кем пойдёшь</p>
</section>

</body></html>
